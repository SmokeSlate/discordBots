name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'SmokeBot/**'
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'SmokeBot/**'
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runtime
        run: python -m pip install -r tests/requirements.txt

      - name: Verify runtime imports
        run: python -c "import discord, aiohttp; print(discord.__version__, aiohttp.__version__)"

      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py"
